<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0e">
  <title>Deepslate Client</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Oxanium:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button type="button" class="brand" data-route="home">
        <img class="brand-mark" src="favicon.svg" alt="Deepslate">
        <span>Deepslate</span>
      </button>
      <nav class="topnav" id="topnav">
        <button type="button" data-route="home">Home</button>
        <button type="button" data-route="mods">Mods</button>
        <button type="button" data-route="wardrobe">Wardrobe</button>
        <button type="button" data-route="settings">Settings</button>
        <button type="button" data-route="servers">Servers</button>
      </nav>
    </div>
    <div class="topbar-right">
      <button type="button" class="icon-pill" id="commandHint">Search</button>
      <div class="streak-pill">1d</div>
      <button type="button" class="profile-pill" data-route="settings">
        <img src="favicon.svg" alt="">
        <span id="navUsername">Player</span>
      </button>
    </div>
  </header>

  <main id="view" class="main-wrap"></main>
  <div id="toasts"></div>
  <div id="overlay"></div>

  <script src="https://unpkg.com"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
