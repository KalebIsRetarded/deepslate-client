```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0e">

  <meta name="application-name" content="Deepslate Client">
  <meta name="description" content="Deepslate Client — Your Minecraft experience, refined.">
  <meta name="color-scheme" content="dark">

  <title>Deepslate Client</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Typography -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Oxanium:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="styles.css">

</head>

<body>

  <!-- Application Shell -->
  <div id="app" class="app-shell">

    <!-- Navigation -->
    <header class="topbar">

      <div class="topbar-left">

        <button
          type="button"
          class="brand"
          data-route="home"
          aria-label="Deepslate Home"
        >
          <img
            class="brand-mark"
            src="favicon.svg"
            alt=""
          >

          <span>Deepslate</span>
        </button>

        <nav
          class="topnav"
          id="topnav"
          aria-label="Main navigation"
        >

          <button type="button" data-route="home">
            Home
          </button>

          <button type="button" data-route="mods">
            Mods
          </button>

          <button type="button" data-route="wardrobe">
            Wardrobe
          </button>

          <button type="button" data-route="settings">
            Settings
          </button>

          <button type="button" data-route="servers">
            Servers
          </button>

        </nav>

      </div>

      <!-- Navigation Utilities -->
      <div class="topbar-right">

        <button
          type="button"
          class="icon-pill"
          id="commandHint"
          aria-label="Open search"
        >
          <span>Search</span>
          <kbd>⌘ K</kbd>
        </button>

        <div
          class="streak-pill"
          title="Activity streak"
          aria-label="One day activity streak"
        >
          1d
        </div>

        <button
          type="button"
          class="profile-pill"
          data-route="settings"
          aria-label="Open player settings"
        >

          <img
            src="favicon.svg"
            alt=""
          >

          <span id="navUsername">
            Player
          </span>

        </button>

      </div>

    </header>

    <!-- Main Application Content -->
    <main
      id="view"
      class="main-wrap"
      tabindex="-1"
    >
      <div class="app-loading">
        <div class="loading-mark">
          <img src="favicon.svg" alt="">
        </div>

        <p>Initializing Deepslate</p>

        <span>Preparing your experience...</span>
      </div>
    </main>

    <!-- Notification System -->
    <div
      id="toasts"
      aria-live="polite"
      aria-atomic="false"
    ></div>

    <!-- Modal / Overlay System -->
    <div
      id="overlay"
      aria-live="polite"
    ></div>

  </div>

  <!-- Application Configuration -->
  <script src="config.js"></script>

  <!-- Application Logic -->
  <script src="app.js"></script>

</body>
</html>
```
