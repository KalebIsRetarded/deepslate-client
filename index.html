<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0e">
  <title>Deepslate Client</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Oxanium:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a class="brand" href="#/home">
        <img class="brand-mark" src="favicon.svg" alt="Deepslate">
        <span class="brand-title">Deepslate</span>
      </a>
      <nav class="topnav" id="topnav">
        <a href="#/home" data-route="home">Home</a>
        <a href="#/mods" data-route="mods">Mods</a>
        <a href="#/wardrobe" data-route="wardrobe">Wardrobe</a>
        <a href="#/settings" data-route="settings">Settings</a>
        <a href="#/servers" data-route="servers">Servers ▾</a>
      </nav>
    </div>

    <div class="topbar-right">
      <button class="icon-pill" id="commandHint" title="Search (Ctrl+K)">🔍</button>
      <div class="streak-pill" id="streakPill">🔥 1</div>
      <a class="profile-pill" href="#/settings" id="profilePill">
        <img id="navAvatar" src="favicon.svg" alt="">
        <span id="navUsername">Player</span>
      </a>
    </div>
  </header>

  <main id="view" class="main-wrap"></main>

  <div id="toasts" aria-live="polite"></div>
  <div id="overlay"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
