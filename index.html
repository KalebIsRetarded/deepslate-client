<!doctype html><html lang="en"><meta charset="utf-8"><title>Deepslate Vanilla Patcher</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;background:#16191d;color:#eee;max-width:800px;margin:35px auto;padding:20px}button{padding:12px;margin:12px 0}a{color:#aaddff}pre{white-space:pre-wrap}</style><h1>Deepslate vanilla patcher</h1><p>Select the original Chromium-Client-vanilla.html (288,172,563 bytes). Your original is not overwritten. This tool changes known plain-text branding, titles and identifiable loading images, not encoded game assets. No files are uploaded.</p><input type="file" id="file" accept=".html"><br><button id="go">Create modified copy</button><p id="status"></p><div id="links"></div><pre id="log"></pre><script>
'use strict';
const image='https://minecraft.wiki/images/Deepslate_%28UD%29_JE3_BE2.png?7635f';
const status=document.getElementById('status'),go=document.getElementById('go');
go.onclick=async()=>{
const f=document.getElementById('file').files[0];
if(!f||f.name!=='Chromium-Client-vanilla.html'||f.size!==288172563){status.textContent='Select the original vanilla file matching the inspected report. Other files are deliberately not accepted.';return;}
go.disabled=true;document.getElementById('links').replaceChildren();
try{
const edits=[],counts={};const decoder=new TextDecoder('windows-1252');
const size=1024*1024,overlap=262144;
const pattern=/<img\b[^>]{0,200000}>|<link\b[^>]{0,200000}>|<title>[^<]{0,400}<\/title>|Chromium Client|Chromium Visuals|\[Chromium\]|\[ChromiumVoice\]/g;
for(let start=0;start<f.size;start+=size){
status.textContent='Inspecting and preparing changes: '+Math.round(start/f.size*100)+'%';
const text=decoder.decode(await f.slice(start,Math.min(f.size,start+size+overlap)).arrayBuffer());pattern.lastIndex=0;let m;
while((m=pattern.exec(text))){if(m.index>=size)break;
const old=m[0];let replacement=old,label='';
if(old.startsWith('<title>')){replacement='<title>Eaglercraft</title>';label='tab titles';}
else if(old.startsWith('<img')){
 if(/alt\s*=\s*["']Chromium Client["']|class\s*=\s*["'][^"']*\bcb-logo\b/.test(old)){
 replacement=old.replace(/src\s*=\s*(["'])[^"']*\1/i,'src="'+image+'"').replace(/Chromium Client/g,'Deepslate Client');label='loading images';
 }
}else if(old.startsWith('<link')){
 if(/rel\s*=\s*["'](?:shortcut icon|icon|apple-touch-icon)["']/i.test(old)){replacement=old.replace(/href\s*=\s*(["'])[^"']*\1/i,'href="'+image+'"');label='icons';}
}else{
 const after=text.slice(m.index+old.length,m.index+old.length+50);
 if(old==='Chromium Client'&&/^ Native Ping\.exe/.test(after))continue;
 replacement=old.replace('Chromium','Deepslate');label='plain-text branding';
}
if(replacement!==old){edits.push({start:start+m.index,end:start+m.index+old.length,replacement,label});counts[label]=(counts[label]||0)+1;}
}
await new Promise(r=>setTimeout(r,0));
}
if(!counts['tab titles']||!counts['plain-text branding'])throw Error('Expected branding was not found. No output created.');
const parts=[];let cursor=0;
for(const edit of edits){if(edit.start<cursor)throw Error('Overlapping changes detected. No output created.');parts.push(f.slice(cursor,edit.start),edit.replacement);cursor=edit.end;}
parts.push(f.slice(cursor));
const blob=new Blob(parts,{type:'text/html;charset=utf-8'});
const audit={originalName:f.name,originalBytes:f.size,outputBytes:blob.size,counts,changes:edits,limitations:['Encoded game payload not modified or tested','Cloudflare deployment and complete game startup not tested','External Deepslate image requires network access','Original service URLs and internal identifiers intentionally retained']};
function link(blob,name,label){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.textContent=label;const p=document.createElement('p');p.appendChild(a);document.getElementById('links').appendChild(p);}
link(blob,f.name,'Save modified Chromium-Client-vanilla.html');
link(new Blob([JSON.stringify(audit,null,2)],{type:'application/json'}),'deepslate-patch-audit.json','Save patch audit');
document.getElementById('log').textContent=JSON.stringify(counts,null,2);
status.textContent='Modified copy ready. Save it in a separate folder first. The original file slices outside the listed edits are reused unchanged. Test through your existing launcher before replacing the hosted copy.';
}catch(e){status.textContent='Stopped: '+e.message;}finally{go.disabled=false;}
};</script></html>
